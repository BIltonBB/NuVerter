[package]
name = "nuverter-tauri"
version = "1.1.36"
description = "NuVerter desktop and mobile (Tauri)"
edition = "2021"

[lib]
name = "nuverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android needs the fs plugin to hand out a write handle for SAF content:// URIs.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
window-vibrancy = "0.8"
# Downloads the yt-dlp binary on first use (see ydl_install in lib.rs).
ureq = "2.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
