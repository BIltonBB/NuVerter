name: Release Tauri

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $conf = 'tauri/src-tauri/tauri.conf.json'
          (Get-Content $conf) -replace '"version":\s*"[^"]+"', ('"version": "' + $tag + '"') | Set-Content $conf
          $cargo = 'tauri/src-tauri/Cargo.toml'
          (Get-Content $cargo) -replace '^version = ".*"', ('version = "' + $tag + '"') | Set-Content $cargo
          Write-Host "Synced version to $tag"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: |
          if (Test-Path desktop/package.json) { Push-Location desktop; npm install; Pop-Location }

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NuVerter ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          projectPath: tauri