name: Release Tauri

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $conf = 'tauri/src-tauri/tauri.conf.json'
          (Get-Content $conf) -replace '"version":\s*"[^"]+"', ('"version": "' + $tag + '"') | Set-Content $conf
          $cargo = 'tauri/src-tauri/Cargo.toml'
          (Get-Content $cargo) -replace '^version = ".*"', ('version = "' + $tag + '"') | Set-Content $cargo
          Write-Host "Synced version to $tag"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NuVerter ${{ github.ref_name }}"
          releaseBody: "Desktop installer plus the Android APK. See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          projectPath: tauri

  android:
    # Wait for the desktop job so the GitHub release already exists.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # A developer's local .cargo/config.toml may point target-dir at D:\ on Windows.
      CARGO_TARGET_DIR: ${{ github.workspace }}/tauri/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync version from tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const confPath = 'tauri/src-tauri/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          conf.version = tag;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          const cargoPath = 'tauri/src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${tag}"`));
          console.log(`Synced version to ${tag}`);
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          # :tauri-android compiles against SDK 36 while the app uses 37.
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Install Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Generate Android project
        working-directory: tauri
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            tauri android init --ci
          fi

      - name: Configure release signing
        if: env.ANDROID_KEY_BASE64 != ''
        working-directory: tauri/src-tauri/gen/android
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/nuverter-upload.jks"
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$RUNNER_TEMP/nuverter-upload.jks" > keystore.properties
          python3 ../../../scripts/android-signing.py app/build.gradle.kts

      - name: Build APK
        working-directory: tauri
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          if [ -f src-tauri/gen/android/keystore.properties ]; then
            tauri android build -t aarch64 --apk
          else
            echo "::warning::ANDROID_KEY_BASE64 is not set - building a debug APK. Set the Android signing secrets so phones can update over an existing install."
            tauri android build -t aarch64 --apk --debug
          fi

      - name: Name the APK
        run: |
          APK=$(find tauri/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          cp "$APK" "NuVerter_${GITHUB_REF_NAME#v}_android.apk"
          ls -lh NuVerter_*_android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuverter-android
          path: NuVerter_*_android.apk
          if-no-files-found: error

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: NuVerter_*_android.apk
          fail_on_unmatched_files: true
